{% extends "base.html" %}
{% block title %}Create Project · ML Platform{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header fw-semibold">Create New Project</div>
        <div class="card-body">
          <form method="post" class="vstack gap-3">
            {% csrf_token %}

            <div>
              <label class="form-label">Project Name</label>
              <input class="form-control" name="name" value="{{ name }}" required placeholder="e.g., Sales Forecasting">
            </div>

            <div>
              <label class="form-label">Description (optional)</label>
              <textarea class="form-control" name="description" rows="3" placeholder="Describe your project...">{{ description }}</textarea>
            </div>

            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit">Create Project</button>
              <a class="btn btn-outline-secondary" href="{% url 'dashboard' %}">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
