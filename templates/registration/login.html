{% extends "base.html" %}
{% block title %}Login · ML Platform{% endblock %}

{% block content %}
<!-- Full Height Container with Hero Background -->
<div class="d-flex align-items-center justify-content-center" style="min-height: 85vh; background: #0f172a; position: relative; overflow: hidden;">
  
  <!-- Ambient Background Blobs -->
  <div style="position: absolute; top: 10%; left: 20%; width: 300px; height: 300px; background: #6366f1; border-radius: 50%; filter: blur(80px); opacity: 0.4;"></div>
  <div style="position: absolute; bottom: 10%; right: 20%; width: 250px; height: 250px; background: #ec4899; border-radius: 50%; filter: blur(80px); opacity: 0.3;"></div>

  <!-- Glass Card -->
  <div class="card border-0 shadow-lg" style="width: 400px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; z-index: 10;">
    
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
        <p class="text-white-50 small">Enter your credentials to continue</p>
      </div>

      <form method="post">
        {% csrf_token %}
        
        {% if form.errors %}
          <div class="alert alert-danger py-2 small bg-danger-subtle border-0 text-danger mb-4">
            Invalid username or password.
          </div>
        {% endif %}

        <div class="mb-3">
          <label class="form-label text-white-50 small fw-bold">USERNAME</label>
          <input type="text" name="username" class="form-control bg-white/10 text-white border-0" style="background: rgba(255,255,255,0.1); color: white;" required>
        </div>

        <div class="mb-4">
          <label class="form-label text-white-50 small fw-bold">PASSWORD</label>
          <input type="password" name="password" class="form-control bg-white/10 text-white border-0" style="background: rgba(255,255,255,0.1); color: white;" required>
        </div>

        <button class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm" type="submit" style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); border: none;">
          Log In
        </button>
      </form>
    </div>

    <div class="card-footer text-center py-3 border-top border-white-10" style="border-color: rgba(255,255,255,0.1);">
      <small class="text-white-50">New here? <a href="{% url 'signup' %}" class="text-white fw-bold text-decoration-none">Create account</a></small>
    </div>
  </div>
</div>
{% endblock %}
